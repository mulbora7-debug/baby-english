<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ec4899">
  <title>Baby English</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="header">
      <button id="home-btn" class="home-btn" type="button" aria-label="처음 화면으로">🏠 처음으로</button>
      <p class="eyebrow">3.5세를 위한 하루 5분 영어</p>
      <div id="progress-wrap" class="progress-wrap" role="group" aria-label="오늘의 진행도">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="progress-text">1 / 4</span>
      </div>
    </header>
    <nav id="day-nav" class="day-nav" aria-label="날짜 선택"></nav>
    <div id="screen" class="screen" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
